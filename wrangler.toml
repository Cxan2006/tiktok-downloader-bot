name = "tiktok-downloader-bot"
main = "src/index.js"
compatibility_date = "2024-01-01"
type = "module"

[env.production]
name = "tiktok-downloader-bot-prod"
route = "https://example.com/*"

[[triggers.crons]]
cron = "0 0 * * *"

[build]
command = "npm install"

[build.upload]
format = "modules"
main = "src/index.js"
